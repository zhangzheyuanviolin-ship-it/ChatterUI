name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Optional suffix for the APK and release tag
        required: false
        default: ""
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: true
      APP_VARIANT: shipit
      APK_BASENAME: ChatterUI-Next-zhCN-a11y
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CHATTERUI_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/chatterui-next-upload.jks

      - name: Configure release signing
        env:
          KEY_ALIAS: ${{ secrets.CHATTERUI_UPLOAD_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.CHATTERUI_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CHATTERUI_UPLOAD_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=chatterui-next-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          text = path.read_text()
          if "keystorePropertiesFile = rootProject.file(\"keystore.properties\")" not in text:
              marker = "android {\n"
              insert = (
                  "android {\n"
                  "    def keystoreProperties = new Properties()\n"
                  "    def keystorePropertiesFile = rootProject.file(\"keystore.properties\")\n"
                  "    if (keystorePropertiesFile.exists()) {\n"
                  "        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "    }\n"
              )
              text = text.replace(marker, insert, 1)
          if "signingConfigs {\n        debug {" in text and "signingConfigs {\n        release {" not in text:
              text = text.replace(
                  "signingConfigs {\n        debug {",
                  "signingConfigs {\n"
                  "        release {\n"
                  "            if (keystorePropertiesFile.exists()) {\n"
                  "                storeFile file(keystoreProperties['storeFile'])\n"
                  "                storePassword keystoreProperties['storePassword']\n"
                  "                keyAlias keystoreProperties['keyAlias']\n"
                  "                keyPassword keystoreProperties['keyPassword']\n"
                  "            }\n"
                  "        }\n"
                  "        debug {",
                  1,
              )
          text, replacements = re.subn(
              r"(release\s*\{[^{}]*?)signingConfig signingConfigs\.debug",
              r"\1signingConfig signingConfigs.release",
              text,
              count=1,
              flags=re.S,
          )
          if replacements == 0:
              raise SystemExit("Failed to update release signingConfig in android/app/build.gradle")
          path.write_text(text)
          PY

      - name: Build signed release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Resolve artifact metadata
        id: artifact
        run: |
          LABEL="${{ github.event.inputs.release_label }}"
          if [ -n "$LABEL" ]; then
            SAFE_LABEL="-$(echo "$LABEL" | tr ' /' '--')"
          else
            SAFE_LABEL=""
          fi
          APK_NAME="${APK_BASENAME}${SAFE_LABEL}-run${{ github.run_number }}.apk"
          TAG_NAME="shipit-apk-${{ github.run_number }}${SAFE_LABEL}"
          echo "apk_path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.apk_name }}
          path: ${{ steps.artifact.outputs.apk_path }}

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.tag_name }}
          name: ${{ steps.artifact.outputs.tag_name }}
          files: ${{ steps.artifact.outputs.apk_path }}
